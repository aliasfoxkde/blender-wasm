services:
  blender-wasm-build:
    build:
      context: .
      dockerfile: Dockerfile
    image: blender-wasm-build:latest
    container_name: blender-wasm-build
    cpus: "${BLENDER_WASM_DOCKER_CPUS:-2}"
    mem_limit: "${BLENDER_WASM_DOCKER_MEMORY:-8g}"
    environment:
      BUILD_JOBS: "${BUILD_JOBS:-2}"
    volumes:
      - ../../:/blender-wasm
      - ../../artifacts:/artifacts
      - blender-cache:/build
    working_dir: /build
    command: >
      bash -c "
        mkdir -p /build-tools &&
        cp /blender-wasm/docker/blender-wasm-build/build.sh /build-tools/build.sh &&
        chmod +x /build-tools/build.sh &&
        echo 'Blender source: /build/src' &&
        ls /build/src/ 2>/dev/null | head -5 &&
        echo 'Ready. Run: ./build-tools/build.sh configure|build'
      "

volumes:
  blender-cache:
